[project]
name = "oa-agents"
version = "0.1.0"
description = "OA 智能体服务：单步 AI 认知节点，代码做确定性流水线"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-ai==2.36.0",
    "litellm>=1.40",
    "langfuse>=2.50",
    "PyMuPDF>=1.24",
    "pillow>=10.0",
    "python-multipart>=0.0.9",
    "opentelemetry-api>=1.44,<2",
    "opentelemetry-sdk>=1.44,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.44,<2",
]

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["core", "agents", "services", "tools", "api"]
